name: Daily Audition Scrape

# Runs automatically every morning, and can also be triggered manually
# from the Actions tab any time via the "Run workflow" button.
on:
  schedule:
    # 12:00 UTC = 8:00 AM Eastern Daylight Time (7:00 AM during EST).
    # To change the time, edit the two numbers below: "minute hour * * *"
    - cron: '0 12 * * *'
  workflow_dispatch:

# Lets this workflow commit the updated dashboard back to the repo.
permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the scraper
        run: python3 scrape_auditions.py

      - name: Publish the updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html auditions_data.json
          git diff --quiet --cached || git commit -m "Daily audition update"
          git push
